name: Release Zoom Controller

# Triggered when a tag matching v* is pushed to the repository.
# To release: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build all platforms
        working-directory: plugins/zoom
        run: make build-all VERSION=${{ steps.version.outputs.VERSION }}

      - name: Create release archives
        working-directory: plugins/zoom
        run: make release VERSION=${{ steps.version.outputs.VERSION }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Zoom Controller ${{ steps.version.outputs.VERSION }}
          body: |
            ## Robo-Stream Zoom Controller ${{ steps.version.outputs.VERSION }}

            Controls the Zoom desktop client via its local API.

            ### Installation

            1. Download the archive for your platform below.
            2. Extract the `zoom-controller` binary.
            3. Move it to `~/.robo-stream-server/plugins/zoom/` (create the directory if needed).
            4. Restart the Robo-Stream server — the Zoom controller will appear automatically.

            ### Requirements

            - Robo-Stream server 1.x or later
            - Zoom desktop client installed and running
          files: |
            plugins/zoom/dist/zoom-controller-${{ steps.version.outputs.VERSION }}-darwin-arm64.tar.gz
            plugins/zoom/dist/zoom-controller-${{ steps.version.outputs.VERSION }}-darwin-amd64.tar.gz
            plugins/zoom/dist/zoom-controller-${{ steps.version.outputs.VERSION }}-windows-amd64.zip
            plugins/zoom/dist/zoom-controller-${{ steps.version.outputs.VERSION }}-linux-amd64.tar.gz
