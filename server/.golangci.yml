run:
  timeout: 5m
  tests: true

linters:
  enable:
    - gofmt
    - govet
    - errcheck
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - typecheck
    - shadow

linters-settings:
  gofmt:
    simplify: true
  govet:
    enable:
      - shadow

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-dirs:
    - frontend
    - build
  exclude-files:
    - ".*_test.go$"
  # Exclude embed directive errors (frontend/dist doesn't exist during linting)
  exclude-rules:
    - linters:
        - typecheck
      text: "pattern all:frontend/dist: no matching files found"
    - path: main.go
      linters:
        - typecheck
      text: "pattern all:frontend/dist"

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
