name: Build and Release Client (Electron)

on:
  push:
    tags:
      - 'client-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  build-macos:
    name: Build Client - macOS
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd client-web
          npm ci

      - name: Build web assets
        run: |
          cd client-web
          npm run build

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/client-v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Electron app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          cd client-web
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            npm run electron:build:mac -- --arm64
          else
            npm run electron:build:mac -- --x64
          fi

      - name: Rename DMG
        run: |
          cd client-web/electron-dist
          VERSION="${{ steps.version.outputs.version }}"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            # electron-builder creates DMG automatically
            mv Robo-Stream-Client-*.dmg robo-stream-client-arm64-${VERSION}.dmg || \
            mv *.dmg robo-stream-client-arm64-${VERSION}.dmg
          else
            mv Robo-Stream-Client-*.dmg robo-stream-client-x86_64-${VERSION}.dmg || \
            mv *.dmg robo-stream-client-x86_64-${VERSION}.dmg
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-macos-${{ matrix.arch }}
          path: client-web/electron-dist/robo-stream-client-*-${{ steps.version.outputs.version }}.dmg

  build-linux:
    name: Build Client - Linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd client-web
          npm ci

      - name: Build web assets
        run: |
          cd client-web
          npm run build

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/client-v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Electron app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          cd client-web
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            npm run electron:build:linux -- --arm64
          else
            npm run electron:build:linux -- --x64
          fi

      - name: Rename Linux packages
        run: |
          cd client-web/electron-dist
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          
          # Rename AppImage
          if [ "$ARCH" = "arm64" ]; then
            mv Robo-Stream-Client-*.AppImage robo-stream-client-arm64-${VERSION}.AppImage 2>/dev/null || true
          else
            mv Robo-Stream-Client-*.AppImage robo-stream-client-x86_64-${VERSION}.AppImage 2>/dev/null || true
          fi
          
          # Rename DEB if it exists
          if [ "$ARCH" = "arm64" ]; then
            mv robo-stream-client_*_arm64.deb robo-stream-client-arm64-${VERSION}.deb 2>/dev/null || true
          else
            mv robo-stream-client_*_amd64.deb robo-stream-client-x86_64-${VERSION}.deb 2>/dev/null || true
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-linux-${{ matrix.arch }}
          path: |
            client-web/electron-dist/robo-stream-client-*-${{ steps.version.outputs.version }}.AppImage
            client-web/electron-dist/robo-stream-client-*-${{ steps.version.outputs.version }}.deb

  build-windows:
    name: Build Client - Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd client-web
          npm ci

      - name: Build web assets
        run: |
          cd client-web
          npm run build

      - name: Get version
        id: version
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $VERSION = "${{ github.event.inputs.version }}"
          } else {
            $VERSION = "${{ github.ref }}".Replace("refs/tags/client-v", "")
          }
          echo "version=$VERSION" >> $env:GITHUB_OUTPUT

      - name: Build Electron app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          cd client-web
          npm run electron:build:win

      - name: Rename Windows installer
        run: |
          cd client-web/electron-dist
          $VERSION = "${{ steps.version.outputs.version }}"
          # electron-builder creates "Robo-Stream-Client Setup X.X.X.exe"
          $installer = Get-ChildItem -Filter "*Setup*.exe" | Select-Object -First 1
          if ($installer) {
            Rename-Item $installer.Name "robo-stream-client-x86_64-$VERSION.exe"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-windows-amd64
          path: client-web/electron-dist/robo-stream-client-x86_64-*.exe

  create-release:
    name: Create GitHub Release
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/client-v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=client-v$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          # macOS DMGs
          cp artifacts/client-macos-arm64/robo-stream-client-arm64-*.dmg release/ 2>/dev/null || echo "macOS arm64 not found"
          cp artifacts/client-macos-x64/robo-stream-client-x86_64-*.dmg release/ 2>/dev/null || echo "macOS x64 not found"
          # Linux packages
          cp artifacts/client-linux-amd64/robo-stream-client-x86_64-*.AppImage release/ 2>/dev/null || echo "Linux x64 AppImage not found"
          cp artifacts/client-linux-amd64/robo-stream-client-x86_64-*.deb release/ 2>/dev/null || echo "Linux x64 DEB not found"
          cp artifacts/client-linux-arm64/robo-stream-client-arm64-*.AppImage release/ 2>/dev/null || echo "Linux arm64 AppImage not found"
          cp artifacts/client-linux-arm64/robo-stream-client-arm64-*.deb release/ 2>/dev/null || echo "Linux arm64 DEB not found"
          # Windows installer
          cp artifacts/client-windows-amd64/robo-stream-client-x86_64-*.exe release/ 2>/dev/null || echo "Windows not found"
          ls -la release/

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cat > release_notes.md << EOF
          ## Robo-Stream Client ${VERSION}
          
          ### Desktop Downloads
          
          **macOS:**
          - \`robo-stream-client-arm64-${VERSION}.dmg\` (Apple Silicon - M1/M2/M3/M4)
          - \`robo-stream-client-x86_64-${VERSION}.dmg\` (Intel)
          
          **Linux:**
          - \`robo-stream-client-x86_64-${VERSION}.AppImage\` (x86_64)
          - \`robo-stream-client-x86_64-${VERSION}.deb\` (x86_64 Debian/Ubuntu)
          - \`robo-stream-client-arm64-${VERSION}.AppImage\` (ARM64)
          - \`robo-stream-client-arm64-${VERSION}.deb\` (ARM64 Debian/Ubuntu)
          
          **Windows:**
          - \`robo-stream-client-x86_64-${VERSION}.exe\` (x86_64 installer)
          
          ### Mobile Downloads
          
          **Android:**
          - [Google Play Store](https://play.google.com/store/apps/details?id=com.robostream.robostreamclient)
          
          **iOS:**
          - [Apple App Store](https://apps.apple.com/app/robo-stream-client)
          
          ### Installation
          
          **macOS:**
          1. Download and open the DMG file
          2. Drag Robo-Stream Client to Applications
          3. Right-click → Open (first time only)
          
          **Linux (AppImage):**
          \`\`\`bash
          chmod +x robo-stream-client-x86_64-${VERSION}.AppImage
          ./robo-stream-client-x86_64-${VERSION}.AppImage
          \`\`\`
          
          **Linux (DEB):**
          \`\`\`bash
          sudo dpkg -i robo-stream-client-x86_64-${VERSION}.deb
          \`\`\`
          
          **Windows:**
          1. Download and run the installer
          2. Follow installation wizard
          3. Launch from Start Menu or Desktop
          
          ### Requirements
          - Robo-Stream Server running on same network
          - OBS Studio 28.0+ on server computer
          
          ### What's New
          See [CHANGELOG.md](https://github.com/robomon1/robo-stream/blob/main/CHANGELOG.md) for details.
          EOF

      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Robo-Stream Client ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
