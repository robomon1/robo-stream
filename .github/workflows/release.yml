          **macOS:** Same as server
          
          **Linux (AppImage):**
          \`\`\`bash
          chmod +x robo-stream-client-x86_64-${VERSION}.appimage
          ./robo-stream-client-x86_64-${VERSION}.appimage
          \`\`\`
          
          **Linux (DEB):**
          \`\`\`bash
          sudo dpkg -i robo-stream-client-x86_64-${VERSION}.deb
          \`\`\`
          
          **Windows:** Run installer
          
          #### Mobile
          Install from app stores or sideload APK on Android.
          
          ---
          
          ### ✅ Requirements
          
          - **Server:** OBS Studio 28.0+, OBS WebSocket enabled
          - **Client:** Server running on same network
          
          ### 📖 Documentation
          
          - [Quick Start Guide](https://github.com/robomon1/robo-stream/blob/main/QUICKSTART.md)
          - [Full Documentation](https://github.com/robomon1/robo-stream)
          
          ### 🐛 Known Issues
          
          See [Issues](https://github.com/robomon1/robo-stream/issues) for current bugs and feature requests.
          
          ### 📝 Changelog
          
          See [CHANGELOG.md](https://github.com/robomon1/robo-stream/blob/main/CHANGELOG.md) for detailed changes.
          EOF

      - name: Check if release exists
        id: check_release
        run: |
          if gh release view ${{ steps.version.outputs.tag }} &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release ${{ steps.version.outputs.tag }} already exists - will update it"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Creating new release ${{ steps.version.outputs.tag }}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Robo-Stream v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: release/*
          # If release exists, this will replace/update it
          # Set fail_on_unmatched: false to not fail if some files are missing
          fail_on_unmatched: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
