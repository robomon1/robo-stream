          ./robo-stream-server-amd64-${VERSION}.appimage
          \`\`\`
          
          **Linux (DEB):**
          \`\`\`bash
          sudo dpkg -i robo-stream-server-amd64-${VERSION}.deb
          robo-stream-server
          \`\`\`
          
          **Windows:**
          1. Download and run installer
          2. Follow setup wizard
          
