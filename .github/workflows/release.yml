name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      android_track:
        description: 'Android release track'
        required: true
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
        default: internal
      ios_destination:
        description: 'iOS upload destination'
        required: true
        type: choice
        options:
          - testflight
          - appstore
        default: testflight

jobs:
  # ============================================================================
  # DETECT VERSION FROM FILES
  # ============================================================================
  
  detect-version:
    name: Detect Version from Code
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.determine.outputs.version }}
      tag: ${{ steps.determine.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: determine
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Tag trigger - extract from tag
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            # Manual trigger or other - read from version.txt
            if [ -f "version.txt" ]; then
              VERSION=$(cat version.txt | tr -d '[:space:]')
            else
              echo "Error: version.txt not found in repository root"
              exit 1
            fi
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          
          echo "Release Version: $VERSION"

  # ============================================================================
  # SERVER BUILDS
  # ============================================================================
  
  build-server-macos:
    name: Build Server - macOS Universal
    needs: detect-version
    runs-on: macos-latest
    if: vars.ENABLE_SERVER_BUILDS != 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Get version
        id: version
        run: |
          VERSION="${{ needs.detect-version.outputs.version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install Apple certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/macos_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/macos_signing.keychain-db"

          echo -n "$MACOS_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          echo "=== Available signing identities ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build macOS Universal Binary
        run: |
          cd server
          wails build -platform darwin/universal -clean

      - name: Sign macOS app
        env:
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/macos_signing.keychain-db"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Find the Developer ID identity name dynamically from the keychain
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "Signing with identity: $IDENTITY"

          codesign --deep --force --verify --verbose \
            --sign "$IDENTITY" \
            --options runtime \
            server/build/bin/Robo-Stream-Server.app

      - name: Create DMG
        run: |
          cd server/build/bin
          
          mkdir -p dmg-temp
          cp -R Robo-Stream-Server.app dmg-temp/
          ln -s /Applications dmg-temp/Applications
          
          hdiutil create -volname "Robo-Stream Server" \
            -srcfolder dmg-temp \
            -ov -format UDZO \
            robo-stream-server-${{ steps.version.outputs.version }}.dmg
          
          rm -rf dmg-temp

      - name: Sign and notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/macos_signing.keychain-db"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
          DMG="server/build/bin/robo-stream-server-${{ steps.version.outputs.version }}.dmg"

          codesign --sign "$IDENTITY" --options runtime "$DMG"

          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "$DMG" 

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-macos-universal
          path: server/build/bin/robo-stream-server-*.dmg

  build-server-linux:
    name: Build Server - Linux
    needs: detect-version
    runs-on: ${{ matrix.runner }}
    if: vars.ENABLE_SERVER_BUILDS != 'false'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Get version
        id: version
        run: |
          VERSION="${{ needs.detect-version.outputs.version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Build Linux Binary
        run: |
          cd server
          go mod download
          wails build -platform linux/${{ matrix.arch }} -clean

      - name: Create DEB package
        run: |
          cd server/build/bin
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          
          mkdir -p robo-stream-server_${VERSION}_${ARCH}/DEBIAN
          mkdir -p robo-stream-server_${VERSION}_${ARCH}/usr/local/bin
          mkdir -p robo-stream-server_${VERSION}_${ARCH}/usr/share/applications
          
          cp robo-stream-server robo-stream-server_${VERSION}_${ARCH}/usr/local/bin/
          chmod +x robo-stream-server_${VERSION}_${ARCH}/usr/local/bin/robo-stream-server
          
          cat > robo-stream-server_${VERSION}_${ARCH}/DEBIAN/control << EOF
          Package: robo-stream-server
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: ${ARCH}
          Maintainer: Robo-Stream Team <robo@robo-stream.com>
          Description: Robo-Stream Server - Remote OBS Control
           Server application for remotely controlling OBS Studio
           through the Robo-Stream client applications.
          EOF
          
          cat > robo-stream-server_${VERSION}_${ARCH}/usr/share/applications/robo-stream-server.desktop << EOF
          [Desktop Entry]
          Name=Robo-Stream Server
          Comment=Remote OBS Control Server
          Exec=/usr/local/bin/robo-stream-server
          Terminal=false
          Type=Application
          Categories=Network;AudioVideo;
          EOF
          
          dpkg-deb --build robo-stream-server_${VERSION}_${ARCH}
          mv robo-stream-server_${VERSION}_${ARCH}.deb robo-stream-server-${ARCH}-${VERSION}.deb

      - name: Create AppImage
        run: |
          cd server/build/bin
          VERSION="${{ steps.version.outputs.version }}"
          MATRIX_ARCH="${{ matrix.arch }}"
          
          # Install FUSE
          sudo apt-get install -y fuse libfuse2
          
          # Create AppDir structure
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          
          # Debug: Check what binaries exist
          echo "=== Binary files in build/bin ==="
          ls -la
          file robo-stream-server || echo "Binary not found"
          
          # Copy binary
          cp robo-stream-server AppDir/usr/bin/
          chmod +x AppDir/usr/bin/robo-stream-server
          
          # Debug: Check AppDir binary
          echo "=== AppDir binary check ==="
          file AppDir/usr/bin/robo-stream-server
          
          # Create .desktop file in BOTH locations (required by appimagetool)
          cat > AppDir/robo-stream-server.desktop << EOF
          [Desktop Entry]
          Name=Robo-Stream Server
          Comment=Remote OBS Control Server
          Exec=robo-stream-server
          Terminal=false
          Type=Application
          Categories=Network;
          Icon=robo-stream-server
          EOF
          
          # Also put in usr/share/applications
          cp AppDir/robo-stream-server.desktop AppDir/usr/share/applications/
          
          # Don't create AppRun - let appimagetool generate it
          # This avoids the architecture detection issue with bash scripts
          
          # Verify AppRun is a script, not a binary
          echo "=== AppDir structure (no AppRun yet) ==="
          ls -la AppDir/
          
          # Create a placeholder icon
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > AppDir/robo-stream-server.png
          cp AppDir/robo-stream-server.png AppDir/usr/share/icons/hicolor/256x256/apps/
          
          # Download appimagetool for the correct architecture
          if [ "${MATRIX_ARCH}" = "amd64" ]; then
            APPIMAGETOOL_ARCH="x86_64"
            RUNTIME_ARCH="x86_64"
          elif [ "${MATRIX_ARCH}" = "arm64" ]; then
            APPIMAGETOOL_ARCH="aarch64"
            RUNTIME_ARCH="aarch64"
          fi
          
          echo "=== Downloading appimagetool-${APPIMAGETOOL_ARCH} ==="
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${APPIMAGETOOL_ARCH}.AppImage -O appimagetool
          chmod +x appimagetool
          
          # Download the runtime separately to avoid architecture detection issues
          echo "=== Downloading runtime-${RUNTIME_ARCH} ==="
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/runtime-${RUNTIME_ARCH} -O runtime
          
          # Extract appimagetool (avoids FUSE runtime issues)
          ./appimagetool --appimage-extract
          
          # Debug: Check all binaries in AppDir
          echo "=== All ELF binaries in AppDir ==="
          find AppDir -type f -exec file {} \; | grep ELF
          
          # Convert arch to AppImage format (amd64 -> x86_64, arm64 -> aarch64)
          if [ "${MATRIX_ARCH}" = "amd64" ]; then
            export ARCH=x86_64
          elif [ "${MATRIX_ARCH}" = "arm64" ]; then
            export ARCH=aarch64
          else
            export ARCH=${MATRIX_ARCH}
          fi
          
          echo "=== Building AppImage with ARCH=${ARCH} ==="
          echo "Environment ARCH=${ARCH}"
          
          # Double-check no other binaries are present
          echo "=== Checking for any other executables ==="
          find AppDir -type f -executable -exec file {} \;
          
          # Use extracted appimagetool with explicit runtime file to avoid architecture detection
          ARCH=${ARCH} ./squashfs-root/AppRun --runtime-file runtime --no-appstream AppDir robo-stream-server-${MATRIX_ARCH}-${VERSION}.appimage
          
          # Cleanup
          rm -rf AppDir appimagetool runtime squashfs-root

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-linux-${{ matrix.arch }}
          path: |
            server/build/bin/robo-stream-server-${{ matrix.arch }}-*.deb
            server/build/bin/robo-stream-server-${{ matrix.arch }}-*.appimage

  build-server-windows:
    name: Build Server - Windows
    needs: detect-version
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read  # Required for checkout
    if: vars.ENABLE_SERVER_BUILDS != 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Get version
        id: version
        run: |
          $VERSION = "${{ needs.detect-version.outputs.version }}"
          echo "version=$VERSION" >> $env:GITHUB_OUTPUT

      - name: Install NSIS
        run: |
          choco install nsis --no-progress -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Install dependencies
        run: |
          cd server
          go mod download

      - name: Build Windows Binary with NSIS installer
        run: |
          cd server
          wails build -platform windows/amd64 -clean -nsis

      - name: Select and rename Windows installer
        id: server_installer
        run: |
          cd server/build/bin
          $VERSION = "${{ steps.version.outputs.version }}"
          $TARGET = "robo-stream-server-x86_64-$VERSION.exe"

          Write-Host "=== Files in server/build/bin ==="
          Get-ChildItem

          if (Test-Path $TARGET) {
            Write-Host "Target installer already exists: $TARGET"
          } else {
            $candidates = Get-ChildItem -File -Filter "*.exe" | Where-Object {
              $_.Name -match '(?i)(setup|installer)'
            }

            if ($candidates.Count -eq 0) {
              $allExe = Get-ChildItem -File -Filter "*.exe"
              if ($allExe.Count -eq 1) {
                $candidates = $allExe
              } else {
                Write-Host "Error: Could not uniquely identify installer executable"
                Write-Host "Found EXEs:"
                $allExe | ForEach-Object { Write-Host " - $($_.Name)" }
                exit 1
              }
            } elseif ($candidates.Count -gt 1) {
              Write-Host "Error: Multiple installer-like executables found"
              $candidates | ForEach-Object { Write-Host " - $($_.Name)" }
              exit 1
            }

            $installer = $candidates | Select-Object -First 1
            Write-Host "Renaming $($installer.Name) to $TARGET"
            Rename-Item $installer.Name $TARGET
          }

          "target_name=$TARGET" >> $env:GITHUB_OUTPUT

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows installer (Azure Artifact Signing)
        uses: azure/artifact-signing-action@v1
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: server/build/bin
          files-folder-filter: ${{ steps.server_installer.outputs.target_name }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signature
        run: |
          cd server/build/bin
          $TARGET = "${{ steps.server_installer.outputs.target_name }}"
          if (-Not (Test-Path $TARGET)) {
            Write-Host "Error: Signed installer not found: $TARGET"
            exit 1
          }
          $sig = Get-AuthenticodeSignature $TARGET
          Write-Host "Signature status: $($sig.Status)"
          if ($sig.Status -ne "Valid") {
            Write-Host "Error: Authenticode signature validation failed for $TARGET"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-windows-amd64
          path: server/build/bin/robo-stream-server-x86_64-*.exe

  # ============================================================================
  # DESKTOP CLIENT BUILDS
  # ============================================================================

  build-client-macos:
    name: Build Client - macOS
    needs: detect-version
    runs-on: macos-latest
    if: vars.ENABLE_CLIENT_BUILDS != 'false'
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get version
        id: version
        run: |
          VERSION="${{ needs.detect-version.outputs.version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          cd client-web
          npm ci

      - name: Build web assets
        run: |
          cd client-web
          npm run build

      - name: Install Apple certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/macos_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/macos_signing.keychain-db"

          echo -n "$MACOS_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Build Electron app
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd client-web
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            npm run electron:build:mac -- --arm64
          else
            npm run electron:build:mac -- --x64
          fi

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd client-web/electron-dist
          DMG=$(find . -maxdepth 1 -name "*.dmg" -type f | head -1)
          if [ -n "$DMG" ]; then
            xcrun notarytool submit "$DMG"               --apple-id "$APPLE_ID"               --password "$APPLE_APP_PASSWORD"               --team-id "$APPLE_TEAM_ID"               --wait
            xcrun stapler staple "$DMG"
          fi

      - name: Rename DMG
        run: |
          cd client-web/electron-dist
          VERSION="${{ steps.version.outputs.version }}"
          
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            TARGET_NAME="robo-stream-client-arm64-${VERSION}.dmg"
            SOURCE_DMG=$(find . -maxdepth 1 -name "*.dmg" ! -name "$TARGET_NAME" -type f | head -1)
            if [ -n "$SOURCE_DMG" ]; then
              mv "$SOURCE_DMG" "$TARGET_NAME"
            else
              echo "Error: No DMG file found to rename"
              ls -la
              exit 1
            fi
          else
            TARGET_NAME="robo-stream-client-x86_64-${VERSION}.dmg"
            SOURCE_DMG=$(find . -maxdepth 1 -name "*.dmg" ! -name "$TARGET_NAME" -type f | head -1)
            if [ -n "$SOURCE_DMG" ]; then
              mv "$SOURCE_DMG" "$TARGET_NAME"
            else
              echo "Error: No DMG file found to rename"
              ls -la
              exit 1
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-macos-${{ matrix.arch }}
          path: client-web/electron-dist/robo-stream-client-*-${{ steps.version.outputs.version }}.dmg

  build-client-linux:
    name: Build Client - Linux
    needs: detect-version
    runs-on: ${{ matrix.runner }}
    if: vars.ENABLE_CLIENT_BUILDS != 'false'
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get version
        id: version
        run: |
          VERSION="${{ needs.detect-version.outputs.version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          cd client-web
          npm ci

      - name: Build web assets
        run: |
          cd client-web
          npm run build

      - name: Build Electron app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          cd client-web
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            npm run electron:build:linux -- --arm64
          else
            npm run electron:build:linux -- --x64
          fi

      - name: Rename Linux packages
        run: |
          cd client-web/electron-dist
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          
          if [ "$ARCH" = "arm64" ]; then
            TARGET_APPIMAGE="robo-stream-client-arm64-${VERSION}.appimage"
            SOURCE_APPIMAGE=$(find . -maxdepth 1 -name "*.AppImage" ! -name "$TARGET_APPIMAGE" -type f | head -1)
            if [ -n "$SOURCE_APPIMAGE" ]; then
              mv "$SOURCE_APPIMAGE" "$TARGET_APPIMAGE"
            fi
            
            TARGET_DEB="robo-stream-client-arm64-${VERSION}.deb"
            SOURCE_DEB=$(find . -maxdepth 1 -name "*.deb" ! -name "$TARGET_DEB" -type f | head -1)
            if [ -n "$SOURCE_DEB" ]; then
              mv "$SOURCE_DEB" "$TARGET_DEB"
            fi
          else
            TARGET_APPIMAGE="robo-stream-client-x86_64-${VERSION}.appimage"
            SOURCE_APPIMAGE=$(find . -maxdepth 1 -name "*.AppImage" ! -name "$TARGET_APPIMAGE" -type f | head -1)
            if [ -n "$SOURCE_APPIMAGE" ]; then
              mv "$SOURCE_APPIMAGE" "$TARGET_APPIMAGE"
            fi
            
            TARGET_DEB="robo-stream-client-x86_64-${VERSION}.deb"
            SOURCE_DEB=$(find . -maxdepth 1 -name "*.deb" ! -name "$TARGET_DEB" -type f | head -1)
            if [ -n "$SOURCE_DEB" ]; then
              mv "$SOURCE_DEB" "$TARGET_DEB"
            fi
          fi
          
          echo "Files in electron-dist:"
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-linux-${{ matrix.arch }}
          path: |
            client-web/electron-dist/robo-stream-client-*-${{ steps.version.outputs.version }}.appimage
            client-web/electron-dist/robo-stream-client-*-${{ steps.version.outputs.version }}.deb

  build-client-windows:
    name: Build Client - Windows
    needs: detect-version
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read  # Required for checkout
    if: vars.ENABLE_CLIENT_BUILDS != 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get version
        id: version
        run: |
          $VERSION = "${{ needs.detect-version.outputs.version }}"
          echo "version=$VERSION" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          cd client-web
          npm ci

      - name: Build web assets
        run: |
          cd client-web
          npm run build

      - name: Build Electron app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          cd client-web
          npm run electron:build:win

      - name: Select and rename Windows installer
        id: client_installer
        run: |
          cd client-web/electron-dist
          $VERSION = "${{ steps.version.outputs.version }}"
          $TARGET = "robo-stream-client-x86_64-$VERSION.exe"

          Write-Host "=== Files in client-web/electron-dist ==="
          Get-ChildItem

          if (Test-Path $TARGET) {
            Write-Host "Target installer already exists: $TARGET"
          } else {
            $candidates = Get-ChildItem -File -Filter "*.exe" | Where-Object {
              $_.Name -match '(?i)(setup|installer)'
            }

            if ($candidates.Count -eq 0) {
              $allExe = Get-ChildItem -File -Filter "*.exe"
              if ($allExe.Count -eq 1) {
                $candidates = $allExe
              } else {
                Write-Host "Error: Could not uniquely identify installer executable"
                Write-Host "Found EXEs:"
                $allExe | ForEach-Object { Write-Host " - $($_.Name)" }
                exit 1
              }
            } elseif ($candidates.Count -gt 1) {
              Write-Host "Error: Multiple installer-like executables found"
              $candidates | ForEach-Object { Write-Host " - $($_.Name)" }
              exit 1
            }

            $installer = $candidates | Select-Object -First 1
            Write-Host "Renaming $($installer.Name) to $TARGET"
            Rename-Item $installer.Name $TARGET
          }

          "target_name=$TARGET" >> $env:GITHUB_OUTPUT

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows installer (Azure Artifact Signing)
        uses: azure/artifact-signing-action@v1
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: client-web/electron-dist
          files-folder-filter: ${{ steps.client_installer.outputs.target_name }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signature
        run: |
          cd client-web/electron-dist
          $TARGET = "${{ steps.client_installer.outputs.target_name }}"
          if (-Not (Test-Path $TARGET)) {
            Write-Host "Error: Signed installer not found: $TARGET"
            exit 1
          }
          $sig = Get-AuthenticodeSignature $TARGET
          Write-Host "Signature status: $($sig.Status)"
          if ($sig.Status -ne "Valid") {
            Write-Host "Error: Authenticode signature validation failed for $TARGET"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-windows-amd64
          path: client-web/electron-dist/robo-stream-client-x86_64-*.exe

  # ============================================================================
  # MOBILE BUILDS (Optional - require secrets)
  # ============================================================================

  build-client-android:
    name: Build Client - Android
    needs: detect-version
    runs-on: ubuntu-22.04
    # Only run if secrets are configured
    if: github.event_name == 'workflow_dispatch' && vars.ENABLE_MOBILE_BUILDS == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Get version and build number
        id: version
        run: |
          VERSION="${{ needs.detect-version.outputs.version }}"
          
          # Auto-generate build number: Unix timestamp minus 1,000,000,000
          # Current value ~770M, max is 2.1B, giving ~42 years of headroom (until 2068)
          BUILD_NUMBER=$(( $(date +%s) - 1000000000 ))
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Building Android v${VERSION} (build ${BUILD_NUMBER})"

      - name: Install dependencies
        run: |
          cd client-web
          npm ci

      - name: Build web assets
        run: |
          cd client-web
          npm run build

      - name: Sync Capacitor
        run: |
          cd client-web
          npx cap sync android

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Error: ANDROID_KEYSTORE_BASE64 secret not set"
            exit 1
          fi
          
          # Decode keystore to app directory
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > client-web/android/app/robostream-release.keystore
          
          # Verify keystore was created
          if [ ! -f client-web/android/app/robostream-release.keystore ]; then
            echo "Error: Failed to create keystore file"
            exit 1
          fi
          
          echo "Keystore created successfully"
          ls -lh client-web/android/app/robostream-release.keystore

      - name: Create keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Validate all secrets are present
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Error: ANDROID_KEYSTORE_PASSWORD secret not set"
            exit 1
          fi
          if [ -z "$KEY_ALIAS" ]; then
            echo "Error: ANDROID_KEY_ALIAS secret not set"
            exit 1
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            echo "Error: ANDROID_KEY_PASSWORD secret not set"
            exit 1
          fi
          
          # Create keystore.properties with correct property names
          # Using printf to avoid heredoc YAML indentation issues
          # Note: storeFile path is relative to the app/ directory in build.gradle
          printf "storeFile=robostream-release.keystore\n" > client-web/android/keystore.properties
          printf "storePassword=%s\n" "$KEYSTORE_PASSWORD" >> client-web/android/keystore.properties
          printf "keyAlias=%s\n" "$KEY_ALIAS" >> client-web/android/keystore.properties
          printf "keyPassword=%s\n" "$KEY_PASSWORD" >> client-web/android/keystore.properties
          
          echo "keystore.properties created successfully"
          echo "--- Contents (passwords masked) ---"
          sed 's/\(Password=\).*/\1***/' client-web/android/keystore.properties

      - name: Update version in build.gradle
        run: |
          cd client-web/android
          sed -i "s/versionName = \".*\"/versionName = \"${{ steps.version.outputs.version }}\"/" variables.gradle
          sed -i "s/versionCode = [0-9]*/versionCode = ${{ steps.version.outputs.build_number }}/" app/build.gradle

      - name: Build Android APK
        run: |
          cd client-web/android
          ./gradlew assembleRelease

      - name: Build Android App Bundle
        run: |
          cd client-web/android
          ./gradlew bundleRelease

      - name: Deploy to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.robostream.robostreamclient
          releaseFiles: client-web/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.android_track }}
          status: completed

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-android-apk
          path: client-web/android/app/build/outputs/apk/release/app-release.apk

  build-client-ios:
    name: Build Client - iOS
    needs: detect-version
    runs-on: macos-latest
    # Only run if secrets are configured
    if: github.event_name == 'workflow_dispatch' && vars.ENABLE_MOBILE_BUILDS == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get version and build number
        id: version
        run: |
          VERSION="${{ needs.detect-version.outputs.version }}"
          
          # Auto-generate build number: Unix timestamp minus 1,000,000,000
          # Current value ~770M, max is 2.1B, giving ~42 years of headroom (until 2068)
          BUILD_NUMBER=$(( $(date +%s) - 1000000000 ))
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Building iOS v${VERSION} (build ${BUILD_NUMBER})"

      - name: Install dependencies
        run: |
          cd client-web
          npm ci

      - name: Build web assets
        run: |
          cd client-web
          npm run build

      - name: Sync Capacitor
        run: |
          cd client-web
          npx cap sync ios

      - name: Install Apple certificate and provisioning profile
        env:
          IOS_BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          # Decode certificate and provisioning profile
          echo -n "$IOS_BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          # Create temporary keychain
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Make it visible to codesign/xcodebuild
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          # Import certificate (.p12 must include private key)
          security import "$CERTIFICATE_PATH" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          # Prevent UI prompts in CI
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Install provisioning profile (best practice: name by UUID)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PP_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PP_UUID.mobileprovision"

          # Debug
          echo "=== Keychains ==="
          security list-keychains -d user

          echo "=== Signing identities found ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning

      - name: Update version and build number in Xcode project
        run: |
          cd client-web/ios/App
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.version }}" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.version.outputs.build_number }}" App/Info.plist

      - name: Build and archive iOS App
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cd client-web/ios/App
          pod install

          xcodebuild \
          -workspace App.xcworkspace \
          -scheme App \
          -sdk iphoneos \
          -configuration Release \
          -archivePath $RUNNER_TEMP/robostream.xcarchive \
          DEVELOPMENT_TEAM=$IOS_TEAM_ID \
          archive

          # xcodebuild \
          #   -workspace App.xcworkspace \
          #   -scheme App \
          #   -sdk iphoneos \
          #   -configuration Release \
          #   -archivePath $RUNNER_TEMP/robostream.xcarchive \
          #   CODE_SIGN_STYLE=Manual \
          #   DEVELOPMENT_TEAM=$IOS_TEAM_ID \
          #   CODE_SIGN_IDENTITY="Apple Distribution" \
          #   PROVISIONING_PROFILE_SPECIFIER="robo-stream-client" \
          #   archive

      - name: Export IPA
        env:
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          echo "=== Signing identities (export step) ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning

          xcodebuild \
            -exportArchive \
            -archivePath $RUNNER_TEMP/robostream.xcarchive \
            -exportOptionsPlist client-web/ios/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          # Decode API key
          mkdir -p ~/.appstoreconnect/private_keys
          API_KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode -o $API_KEY_PATH
          
          # Upload to TestFlight or App Store
          xcrun altool --upload-app \
            --type ios \
            --file $RUNNER_TEMP/export/*.ipa \
            --apiKey $APP_STORE_CONNECT_API_KEY_ID \
            --apiIssuer $APP_STORE_CONNECT_API_ISSUER_ID

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa

  # ============================================================================
  # ZOOMOSC PLUGIN BUILD
  # ============================================================================

  build-plugin-zoomosc:
    name: Build ZoomOSC Plugin - All Platforms
    needs: detect-version
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Get version
        id: version
        run: |
          VERSION="${{ needs.detect-version.outputs.version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build all platforms
        run: |
          cd plugins/zoomosc
          BINARY=zoomosc-controller
          VERSION="${{ steps.version.outputs.version }}"
          LDFLAGS="-ldflags \"-s -w -X main.Version=$VERSION\""
          mkdir -p dist

          echo "Building darwin/arm64..."
          GOOS=darwin  GOARCH=arm64 go build -ldflags "-s -w -X main.Version=$VERSION" -o dist/${BINARY}-darwin-arm64 .

          echo "Building darwin/amd64..."
          GOOS=darwin  GOARCH=amd64 go build -ldflags "-s -w -X main.Version=$VERSION" -o dist/${BINARY}-darwin-amd64 .

          echo "Building windows/amd64..."
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -X main.Version=$VERSION" -o dist/${BINARY}-windows-amd64.exe .

          echo "Building linux/amd64..."
          GOOS=linux   GOARCH=amd64 go build -ldflags "-s -w -X main.Version=$VERSION" -o dist/${BINARY}-linux-amd64 .

      - name: Create release archives
        run: |
          cd plugins/zoomosc/dist
          BINARY=zoomosc-controller
          VERSION="${{ steps.version.outputs.version }}"

          tar czf ${BINARY}-${VERSION}-darwin-arm64.tar.gz   ${BINARY}-darwin-arm64
          tar czf ${BINARY}-${VERSION}-darwin-amd64.tar.gz   ${BINARY}-darwin-amd64
          zip     ${BINARY}-${VERSION}-windows-amd64.zip     ${BINARY}-windows-amd64.exe
          tar czf ${BINARY}-${VERSION}-linux-amd64.tar.gz    ${BINARY}-linux-amd64

          echo "Archives created:"
          ls -lh *.tar.gz *.zip

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zoomosc
          path: plugins/zoomosc/dist/zoomosc-controller-*.{tar.gz,zip}

  # ============================================================================
  # CREATE UNIFIED RELEASE
  # ============================================================================

  create-release:
    name: Create GitHub Release
    needs:
      - detect-version
      - build-server-macos
      - build-server-linux
      - build-server-windows
      - build-client-macos
      - build-client-linux
      - build-client-windows
      - build-plugin-zoomosc
    if: always() && needs.detect-version.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION="${{ needs.detect-version.outputs.version }}"
          TAG="${{ needs.detect-version.outputs.tag }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          
          # Server builds
          cp artifacts/server-macos-universal/robo-stream-server-*.dmg release/ 2>/dev/null || echo "Server macOS not found"
          cp artifacts/server-linux-amd64/robo-stream-server-amd64-*.appimage release/ 2>/dev/null || echo "Server Linux amd64 appimage not found"
          cp artifacts/server-linux-amd64/robo-stream-server-amd64-*.deb release/ 2>/dev/null || echo "Server Linux amd64 deb not found"
          cp artifacts/server-linux-arm64/robo-stream-server-arm64-*.appimage release/ 2>/dev/null || echo "Server Linux arm64 appimage not found"
          cp artifacts/server-linux-arm64/robo-stream-server-arm64-*.deb release/ 2>/dev/null || echo "Server Linux arm64 deb not found"
          cp artifacts/server-windows-amd64/robo-stream-server-x86_64-*.exe release/ 2>/dev/null || echo "Server Windows not found"
          
          # Client desktop builds
          cp artifacts/client-macos-arm64/robo-stream-client-arm64-*.dmg release/ 2>/dev/null || echo "Client macOS arm64 not found"
          cp artifacts/client-macos-x64/robo-stream-client-x86_64-*.dmg release/ 2>/dev/null || echo "Client macOS x64 not found"
          cp artifacts/client-linux-x64/robo-stream-client-x86_64-*.appimage release/ 2>/dev/null || echo "Client Linux x64 appimage not found"
          cp artifacts/client-linux-x64/robo-stream-client-x86_64-*.deb release/ 2>/dev/null || echo "Client Linux x64 deb not found"
          cp artifacts/client-linux-arm64/robo-stream-client-arm64-*.appimage release/ 2>/dev/null || echo "Client Linux arm64 appimage not found"
          cp artifacts/client-linux-arm64/robo-stream-client-arm64-*.deb release/ 2>/dev/null || echo "Client Linux arm64 deb not found"
          cp artifacts/client-windows-amd64/robo-stream-client-x86_64-*.exe release/ 2>/dev/null || echo "Client Windows not found"
          
          # Client mobile builds (if available)
          cp artifacts/client-android-apk/app-release.apk release/robo-stream-client-${{ steps.version.outputs.version }}.apk 2>/dev/null || echo "Android APK not found (mobile builds may be disabled)"
          cp artifacts/client-ios-ipa/*.ipa release/robo-stream-client-${{ steps.version.outputs.version }}.ipa 2>/dev/null || echo "iOS IPA not found (mobile builds may be disabled)"

          # ZoomOSC plugin
          cp artifacts/plugin-zoomosc/zoomosc-controller-*.tar.gz release/ 2>/dev/null || echo "ZoomOSC plugin archives not found"
          cp artifacts/plugin-zoomosc/zoomosc-controller-*.zip    release/ 2>/dev/null || echo "ZoomOSC plugin Windows archive not found"

          ls -la release/

      - name: Generate release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cat > release_notes.md << EOF
          ## Robo-Stream v${VERSION}
          
          Complete release with server and client applications for all platforms.
          
          ### 🖥️ Server Downloads
          
          **macOS (Universal - Intel & Apple Silicon):**
          - \`robo-stream-server-${VERSION}.dmg\`
          
          **Linux:**
          - \`robo-stream-server-amd64-${VERSION}.appimage\` (x86_64 portable)
          - \`robo-stream-server-amd64-${VERSION}.deb\` (x86_64 Debian/Ubuntu)
          - \`robo-stream-server-arm64-${VERSION}.appimage\` (ARM64 portable)
          - \`robo-stream-server-arm64-${VERSION}.deb\` (ARM64 Debian/Ubuntu)
          
          **Windows:**
          - \`robo-stream-server-x86_64-${VERSION}.exe\` (x86_64 installer)
          
          ### 💻 Desktop Client Downloads
          
          **macOS:**
          - \`robo-stream-client-arm64-${VERSION}.dmg\` (Apple Silicon - M1/M2/M3/M4)
          - \`robo-stream-client-x86_64-${VERSION}.dmg\` (Intel)
          
          **Linux:**
          - \`robo-stream-client-x86_64-${VERSION}.appimage\` (x86_64 portable)
          - \`robo-stream-client-x86_64-${VERSION}.deb\` (x86_64 Debian/Ubuntu)
          - \`robo-stream-client-arm64-${VERSION}.appimage\` (ARM64 portable)
          - \`robo-stream-client-arm64-${VERSION}.deb\` (ARM64 Debian/Ubuntu)
          
          **Windows:**
          - \`robo-stream-client-x86_64-${VERSION}.exe\` (x86_64 installer)
          
          ### 📱 Mobile Client
          
          **Android:**
          - [Google Play Store](https://play.google.com/store/apps/details?id=com.robostream.robostreamclient)
          - \`robo-stream-client-${VERSION}.apk\` (sideload)
          
          **iOS:**
          - [Apple App Store](https://apps.apple.com/app/robo-stream-client)
          - [TestFlight](https://testflight.apple.com/join/YOUR_CODE) (beta)
          - \`robo-stream-client-${VERSION}.ipa\` (development/enterprise only)

          ### 🔌 ZoomOSC Plugin Downloads

          Standalone controller plugin that bridges ZoomOSC to Robo-Stream.

          **macOS:**
          - \`zoomosc-controller-${VERSION}-darwin-arm64.tar.gz\` (Apple Silicon)
          - \`zoomosc-controller-${VERSION}-darwin-amd64.tar.gz\` (Intel)

          **Linux:**
          - \`zoomosc-controller-${VERSION}-linux-amd64.tar.gz\` (x86_64)

          **Windows:**
          - \`zoomosc-controller-${VERSION}-windows-amd64.zip\` (x86_64)

          ---

          ### 📦 Installation
          
          #### Server
          
          **macOS:**
          1. Download and open DMG
          2. Drag to Applications
          3. Right-click → Open (first time)
          
          **Linux (AppImage):**
          \`\`\`bash
