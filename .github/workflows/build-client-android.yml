name: Build and Release Client (Android)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: true
        type: string
      build_number:
        description: 'Build number (integer, must increment)'
        required: true
        type: string
      track:
        description: 'Release track'
        required: true
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
        default: internal

jobs:
  build-android:
    name: Build and Release Android App
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          cd client-web
          npm ci

      - name: Build web assets
        run: |
          cd client-web
          npm run build

      - name: Sync Capacitor
        run: |
          cd client-web
          npx cap sync android

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > client-web/android/app/robostream-release.keystore

      - name: Create keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > client-web/android/keystore.properties << EOF
          storeFile=robostream-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Update version in build.gradle
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd client-web/android
          sed -i "s/versionName = \".*\"/versionName = \"${{ github.event.inputs.version }}\"/" variables.gradle
          sed -i "s/versionCode = [0-9]*/versionCode = ${{ github.event.inputs.build_number }}/" app/build.gradle

      - name: Build Android App Bundle
        run: |
          cd client-web/android
          ./gradlew bundleRelease

      - name: Build Android APK
        run: |
          cd client-web/android
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: client-web/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: client-web/android/app/build/outputs/bundle/release/app-release.aab

      - name: Deploy to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.robostream.robostreamclient
          releaseFiles: client-web/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
          inAppUpdatePriority: 2
          whatsNewDirectory: client-web/android/whatsnew

  create-release:
    name: Add to GitHub Release
    needs: [build-android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/client-v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=client-v$VERSION" >> $GITHUB_OUTPUT

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts

      - name: Rename APK
        run: |
          mkdir -p release
          cp artifacts/app-release.apk release/robo-stream-client-v${{ steps.version.outputs.version }}.apk

      - name: Generate release notes
        run: |
          cat > release_notes.md << 'EOF'
          ## Robo-Stream Client (Android) ${{ steps.version.outputs.version }}
          
          ### Download
          
          **Android APK (Sideload):**
          - `robo-stream-client-v${{ steps.version.outputs.version }}.apk`
          
          **Google Play Store:**
          - [Download from Play Store](https://play.google.com/store/apps/details?id=com.robostream.robostreamclient)
          
          ### Installation (APK)
          
          1. Enable "Install from Unknown Sources" in Android Settings
          2. Download APK to your device
          3. Open and install
          4. Launch Robo-Stream Client
          
          ### Requirements
          - Android 5.0+ (API 22+)
          - Robo-Stream Server on same network
          
          ### What's New
          See [CHANGELOG.md](https://github.com/robomon1/robo-stream/blob/main/CHANGELOG.md) for details.
          EOF

      - name: Update or Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Robo-Stream Client ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            release/robo-stream-client-v${{ steps.version.outputs.version }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
