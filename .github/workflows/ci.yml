name: CI Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  GO_VERSION: '1.21'
  NODE_VERSION: '20'

jobs:
  test-server-macos:
    name: Test Server Build - macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build server
        run: |
          cd server
          wails build

      - name: Test binary exists
        run: |
          cd server
          test -d "build/bin/Robo-Stream-Server.app"

  test-server-linux:
    name: Test Server Build - Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            build-essential

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build server
        run: |
          cd server
          wails build

      - name: Test binary exists
        run: |
          cd server
          test -f "build/bin/robo-stream-server"

  test-server-windows:
    name: Test Server Build - Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build server
        shell: bash
        run: |
          cd server
          wails build

      - name: Test binary exists
        shell: bash
        run: |
          cd server
          test -f "build/bin/Robo-Stream-Server.exe"

  test-client-web-build:
    name: Test Client Web Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd client-web
          npm ci

      - name: Build web assets
        run: |
          cd client-web
          npm run build

      - name: Test build output exists
        run: |
          cd client-web
          test -d "dist"

  test-client-electron:
    name: Test Electron Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd client-web
          npm ci

      - name: Build web assets
        run: |
          cd client-web
          npm run build

      - name: Test Electron packaging (no installer)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          cd client-web
          npm run electron:build:linux -- --dir
          test -d "electron-dist/linux-unpacked"

  test-client-android:
    name: Test Android Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          cd client-web
          npm ci

      - name: Build web assets
        run: |
          cd client-web
          npm run build

      - name: Sync Capacitor
        run: |
          cd client-web
          npx cap sync android

      - name: Build debug APK
        run: |
          cd client-web/android
          ./gradlew assembleDebug

      - name: Test APK exists
        run: |
          cd client-web/android
          test -f "app/build/outputs/apk/debug/app-debug.apk"

  # Optional: Add linting
  lint-server:
    name: Lint Server Code
    runs-on: ubuntu-22.04
    continue-on-error: true  # Don't fail CI if linting has issues
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Build frontend (required for go:embed)
        run: |
          cd server
          # Generate frontend/dist directory
          wails build -skipbindings -s || true
          # Or just create the directory if build fails
          mkdir -p frontend/dist
          touch frontend/dist/.gitkeep

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          working-directory: server
          args: --timeout=5m

  lint-client:
    name: Lint Client Code
    runs-on: ubuntu-22.04
    continue-on-error: true  # Don't fail CI if linting has issues
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd client-web
          npm ci

      - name: Run ESLint
        run: |
          cd client-web
          npm run lint || echo "No lint script configured"
